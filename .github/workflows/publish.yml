name: Publish images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  fedora43:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: fedora43
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lightzone-builder:fedora43
            ghcr.io/${{ github.repository_owner }}/lightzone-builder:latest
